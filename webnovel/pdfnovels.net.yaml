# ------------------------------------------------------------
# 小説サイト定義
name: &name タテ書き小説ネット
sitename: *name
domain: ncode.syosetu.com
top_url: http://localhost:8080
url: \\k<top_url>/narou/(?<ncode>n\d+[a-z]+)/
encoding: UTF-8
confirm_over18: yes
append_title_to_folder_name: yes
title_strip_pattern: null

version: 2.1

# ------------------------------------------------------------
# 目次取得設定
toc_url: \\k<top_url>/narou/\\k<ncode>/
subtitles: |-
  (?:<div class="p-eplist__chapter-title">(?<chapter>.+?)</div>\s*)?<div class="p-eplist__sublist">\s*<a href="(?<href>\/pixiv/(?<ncode>[sc]\d+)\/(?<index>\d+)\/)" class="p-eplist__subtitle">\s*(?<subtitle>.+?)\s*</a>\s*<div class="p-eplist__update">\s*(?:<span class="p-eplist__favep">.+?</span></span>)?(?<subdate>.+?)(?:<span title="(?<subupdate>.+?) 改稿">（<u>改</u>）</span>)?</div>\s*</div>

# ------------------------------------------------------------
# 本文取得設定
body_pattern: |-
  <div class="js-novel-text p-novel__text">\s*(?<body>.+?)\s*</div>
introduction_pattern: |-
  <div class="js-novel-text p-novel__text p-novel__text--preface">\s*(?<introduction>.+?)\s*</div>
postscript_pattern: |-
  <div class="js-novel-text p-novel__text p-novel__text--afterword">\s*(?<postscript>.+?)\s*</div>

illust_current_url: null
illust_grep_pattern:  <img src="(?<src>.+?)"[^>]*>

# ------------------------------------------------------------
# 小説情報からパースするための設定
novel_info_url: \\k<top_url>/narou/\\k<ncode>/info/

# タイトル
t: <h1><a href="[^"]+"[^>]*>(?<title>.+?)</a></h1>

# novel_type 小説種別
nt: <span id="noveltype"[^>]*>(?<novel_type>.+?)</span>
novel_type_string:
  連載中: 1
  完結済: 3
  短編: 2

# general_all_no 掲載話数
ga: </span>\s*全(?<general_all_no>\d+)エピソード

# story あらすじ（空でもマッチ）
s: <td class="ex">(?<story>.*?)</td>

# general_firstup 初回掲載日
gf: <th>掲載日</th>\s*<td>(?<general_firstup>.+?)</td>

# novelupdated_at 小説の更新時刻
nu: <th>(?:最終更新日|最新掲載日|最終掲載日)</th>\s*<td>(?<novelupdated_at>.+?)</td>

# general_lastup 最終掲載日
gl: <th>(?:最新掲載日|最終掲載日)</th>\s*<td>(?<general_lastup>.+?)</td>

# writer 作者名
w: <th>作者名</th>\s*<td>(?:<a[^>]*>)?(?<writer>.+?)(?:</a>)?</td>

# length 文字数（カンマ付き対応）
l: <th>文字数</th>\s*<td>(?<length>[\d,]+)文字</td>