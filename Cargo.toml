[package]
name = "narou_bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8"
axum-extra = { version = "0.12", features = ["multipart"] }
base64 = "0.22.1"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
http = "1.4.0"
http-body-util = "0.1.3"
mime = "0.3.17"
rand = "0.10.1"
reqwest = { version = "0.13.2", features = ["blocking", "json", "rustls"] }
lopdf = "0.40.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-pickle = "1.2.0"
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.18"
toml = "1.1.2"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.0", features = ["v4", "fast-rng", "serde"] }
