[package]
name = "narou_bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0"
axum-extra = { version = "0", features = ["multipart"] }
bytes = "1"
chrono = { version = "0", features = ["serde"] }
http = "1"
http-body-util = "0"
reqwest = { version = "0", features = ["blocking", "json", "rustls"] }
lopdf = "0"
rusqlite = { version = "0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0", features = ["fs", "trace", "set-header"] }
tracing = "0"
tracing-subscriber = "0"
uuid = { version = "1", features = ["v4", "fast-rng", "serde"] }
tracing-appender = "0"
regex = "1"
sha2 = "0"
zip = "8"
tempfile = "3"
indicatif = "0"
ua_generator = { git = "https://github.com/spider-rs/ua_generator.git", version = "0" }
tower = { version = "0.5.3", features = ["util"] }
