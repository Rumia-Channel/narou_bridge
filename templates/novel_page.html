<!DOCTYPE html>
<html lang="ja">
<head>

<link rel="stylesheet" href="/css/novel_page_modern.css">

<link rel="apple-touch-icon" sizes="180x180" href="/icon/icon_180x180.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icon/icon_167x167.png">

</head>
<body>

    <a href="{back_url}" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        <span>戻る</span>
    </a>
    <h1>{header_title}</h1>
    {nav_links}
</header>
<div class="novel-container">
{body}
</div>
<script src="/script/width-selector.js"></script>

</html>
