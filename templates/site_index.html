<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{site_name} Index</title>
    <link rel="stylesheet" href="/css/site_index_modern.css">
    <link rel="icon" href="/icon/favicon.ico">
    <script>fetch('/manifest.json',{method:'HEAD'}).then(function(r){if(r.ok){var l=document.createElement('link');l.rel='manifest';l.href='/manifest.json';document.head.appendChild(l)}}).catch(function(){})</script>
</head>
<body>
    <header class="app-header">
        <a href="../" class="back-link"><span>戻る</span></a>
        <h1>{site_name}</h1>
    </header>

    <main class="container">
        <form class="card" method="get">
            <div class="card-body">
                <div class="filter-grid">
                    <div class="filter-group">
                        <label class="filter-label" for="search">検索</label>
                        <input id="search" name="search" class="filter-select" value="{search_value}" placeholder="タイトル・作者・タグ">
                    </div>
                    <div class="filter-group">
                        <label class="filter-label" for="type">形式</label>
                        <select id="type" name="type" class="filter-select">
                            <option value=""{type_all_selected}>すべて</option>
                            <option value="novel"{type_novel_selected}>小説</option>
                            <option value="comic"{type_comic_selected}>漫画</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label" for="serialization">連載状況</label>
                        <select id="serialization" name="serialization" class="filter-select">
                            <option value=""{serialization_all_selected}>すべて</option>
                            <option value="短編"{serialization_short_selected}>短編</option>
                            <option value="連載中"{serialization_active_selected}>連載中</option>
                            <option value="完結済"{serialization_complete_selected}>完結済</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label" for="sort">並び順</label>
                        <select id="sort" name="sort" class="filter-select">
                            <option value="updated_desc"{sort_updated_desc_selected}>更新日（新しい順）</option>
                            <option value="updated_asc"{sort_updated_asc_selected}>更新日（古い順）</option>
                            <option value="title_asc"{sort_title_asc_selected}>タイトル（昇順）</option>
                            <option value="title_desc"{sort_title_desc_selected}>タイトル（降順）</option>
                            <option value="author_asc"{sort_author_asc_selected}>作者（昇順）</option>
                            <option value="author_desc"{sort_author_desc_selected}>作者（降順）</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label" for="per_page">表示件数</label>
                        <select id="per_page" name="per_page" class="filter-select">
                            <option value="10"{per_page_10_selected}>10</option>
                            <option value="25"{per_page_25_selected}>25</option>
                            <option value="50"{per_page_50_selected}>50</option>
                            <option value="100"{per_page_100_selected}>100</option>
                        </select>
                    </div>
                </div>
                <div class="filter-row" style="margin-top: 0.75rem;">
                    <button type="submit" class="btn btn-primary">適用</button>
                    <a class="btn btn-outline" href="./">リセット</a>
                </div>
            </div>
        </form>

        <div class="table-wrapper">
            <table>
                <thead>{initial_table_head}</thead>
                <tbody>{initial_table_rows}</tbody>
            </table>
        </div>

        <nav class="pagination" aria-label="ページ送り">
            {previous_page_link}
            <span id="page-info">{page_info}</span>
            {next_page_link}
        </nav>
    </main>
</body>
</html>
